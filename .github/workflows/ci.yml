name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the rust-toolchain.toml pin
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      # The real-sai backend must always *compile* against the vendored
      # headers, even though it can only run on hardware with a vendor blob.
      - run: cargo clippy -p hemlock-sai --features real-sai --all-targets -- -D warnings
      - run: cargo build -p hemlock-syncd --features real-sai
      # The openbcm backend needs no vendor artifacts at all: its ABI is
      # our own committed header, and its tests dlopen a stub shim built
      # from source here. So unlike real-sai it is fully *tested* in CI,
      # not merely compiled.
      - run: cargo clippy -p hemlock-sai --features openbcm --all-targets -- -D warnings
      - run: cargo test -p hemlock-sai --features openbcm
      - run: cargo build -p hemlock-syncd --features openbcm
      # Definition-of-done gates: every shipped platform must lint.
      - name: Lint platform manifests
        run: |
          for dir in platforms/*/; do
            id="$(basename "$dir")"
            case "$id" in _*) continue ;; esac
            echo "== $id"
            cargo run -q -p hemlockctl -- platform lint "$dir"
          done
      # The image workflow's platform dropdown must list every platform
      # (GitHub choice inputs are static YAML; keep them in sync here).
      - name: Check image-workflow platform dropdown
        run: |
          actual=$(ls -d platforms/*/ | xargs -n1 basename | grep -v '^_' | sort)
          listed=$(awk '/^        options:$/{flag=1;next} /^        default:/{flag=0} flag {sub(/^ *- */,""); print}' .github/workflows/image.yml | sort)
          if [ "$actual" != "$listed" ]; then
            echo "::error::platform dropdown in image.yml is out of sync with platforms/"
            echo "platforms/:  $actual"
            echo "dropdown:    $listed"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund
      - run: cd web && npm run build

  motd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p hemlockctl
      - run: bash build/test-motd.sh --hemlockctl target/debug/hemlockctl

  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools musl-tools
      - run: rustup show
      # The ONIE installer must be a static musl binary (no loader in ONIE).
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # The ARM installer links with rust-lld, so no C cross-toolchain is
      # needed here — only the target's std.
      - run: rustup target add armv7-unknown-linux-musleabi
      - run: bash build/mkimage.sh cel-e1031 --dummy-rootfs
      - run: bash build/verify-image.sh build/out/hemlock-*-cel-e1031.bin
      # The armhf path assembles a FIT instead of GRUB artifacts and a
      # static ARM installer instead of an x86 one. Structural only: no
      # ARM toolchain, no vendor artifacts, no kernel.
      - run: bash build/mkimage.sh accton-as4610-54 --dummy-rootfs
      - run: bash build/verify-image.sh build/out/hemlock-*-accton-as4610-54.bin
