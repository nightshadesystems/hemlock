name: Image build

# On-demand ONIE image build for a specific platform.
#
#   full  — fetch vendor artifacts (SAI deb, config.bcm, saibcm-modules),
#           debootstrap a real Debian trixie rootfs, build the BDE kernel
#           modules in the chroot, and produce an installable .bin.
#   dummy — structural layout test only (no root, no vendor artifacts).
#
# The dummy mode also runs in the main CI on every push (ci.yml).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform id under platforms/"
        type: string
        default: "cel-e1031"
      mode:
        description: "Image mode"
        type: choice
        options: [full, dummy]
        default: full

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools debootstrap
          # Ubuntu's debootstrap may predate trixie; alias its script.
          if [ ! -e /usr/share/debootstrap/scripts/trixie ]; then
            sudo ln -s sid /usr/share/debootstrap/scripts/trixie
          fi

      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Fetch vendor artifacts
        if: inputs.mode == 'full'
        run: vendor/fetch-vendor.sh "${{ inputs.platform }}"

      - name: Build image (full)
        if: inputs.mode == 'full'
        # debootstrap/chroot need root; keep the user's rustup toolchain.
        run: |
          sudo --preserve-env=HOME env "PATH=$PATH" \
            CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            bash build/mkimage.sh "${{ inputs.platform }}"

      - name: Build image (dummy)
        if: inputs.mode == 'dummy'
        run: bash build/mkimage.sh "${{ inputs.platform }}" --dummy-rootfs

      - name: Verify image structure
        run: bash build/verify-image.sh build/out/hemlock-*-"${{ inputs.platform }}".bin

      - uses: actions/upload-artifact@v4
        with:
          name: hemlock-image-${{ inputs.platform }}-${{ inputs.mode }}
          path: build/out/*.bin
          if-no-files-found: error
