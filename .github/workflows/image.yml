name: Image build

# On-demand ONIE image build for a specific platform.
#
#   full  — fetch vendor artifacts, debootstrap a real Debian trixie
#           rootfs, build the BDE kernel modules in the chroot, and
#           produce an installable .bin. For an armhf/openbcm platform
#           this also builds the platform kernel deb and the OpenBCM
#           userland + shim (both cached; the first uncached run is
#           slow — an hour-plus for the SDK alone).
#   dummy — structural layout test only (no root, no vendor artifacts).
#
# The dummy mode also runs in the main CI on every push (ci.yml).
#
# Non-release builds stamp the VERSION with the UTC build time
# (hemlock-0.1.0-YYYYMMDDHHMM-<platform>.bin); the "release" checkbox
# ships the plain VERSION.
on:
  workflow_dispatch:
    inputs:
      # Dropdown of supported platforms. GitHub requires this list to be
      # static YAML; CI fails if it drifts from the platforms/ directory
      # (see the platform-dropdown check in ci.yml).
      platform:
        description: "Platform ID"
        type: choice
        options:
          - accton-as4610-54
          - cel-e1031
        default: cel-e1031
      mode:
        description: "Image Mode"
        type: choice
        options: [full, dummy]
        default: full
      release:
        description: "Release build (clean version, no timestamp)"
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What the platform needs, read from its manifest rather than
      # hardcoded: an ARM board wants a foreign-architecture rootfs and a
      # FIT, neither of which an x86-only toolset can produce.
      - name: Resolve platform architecture
        id: arch
        run: |
          manifest="platforms/${{ inputs.platform }}/platform.toml"
          arch=$(sed -n 's/^cpu_arch[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$manifest" | head -1)
          backend=$(sed -n 's/^backend[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$manifest" | head -1)
          echo "cpu_arch=${arch:-amd64}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend:-sai}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools debootstrap musl-tools
          # Ubuntu's debootstrap may predate trixie; alias its script.
          if [ ! -e /usr/share/debootstrap/scripts/trixie ]; then
            sudo ln -s sid /usr/share/debootstrap/scripts/trixie
          fi

      - name: Install armhf cross prerequisites
        if: steps.arch.outputs.cpu_arch == 'armhf'
        run: |
          # qemu-user-static + binfmt: debootstrap's second stage runs the
          # packages' maintainer scripts inside the foreign-arch chroot.
          # u-boot-tools/device-tree-compiler: the FIT boot image.
          # gcc-arm-linux-gnueabihf: links the cross-built daemons.
          sudo apt-get install -y \
            qemu-user-static binfmt-support \
            u-boot-tools device-tree-compiler \
            gcc-arm-linux-gnueabihf
          # The package registers the binfmt handlers, but confirm rather
          # than assume: without them the second stage fails deep inside
          # debootstrap with a much less obvious error.
          sudo update-binfmts --enable qemu-arm || true
          test -e /proc/sys/fs/binfmt_misc/qemu-arm \
            || { echo "::error::binfmt qemu-arm is not registered"; exit 1; }

      - run: rustup show
      # The ONIE installer must be a static musl binary (no loader in ONIE).
      - run: rustup target add x86_64-unknown-linux-musl
      - name: Add armhf Rust targets
        if: steps.arch.outputs.cpu_arch == 'armhf'
        # The daemons are gnueabihf (they link against the image's glibc);
        # the installer is static soft-float musl (ONIE's rescue kernel
        # has no VFP for userspace). Neither needs a C cross-toolchain
        # for the installer itself — mkimage links that with rust-lld.
        run: rustup target add armv7-unknown-linux-gnueabihf armv7-unknown-linux-musleabi
      - uses: Swatinem/rust-cache@v2

      # Release builds ship the plain VERSION; everything else gets a
      # YYYYMMDDHHMM stamp so ad-hoc images are distinguishable.
      - name: Compute image version
        id: ver
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ inputs.release }}" = "true" ]; then
            echo "version=$base" >> "$GITHUB_OUTPUT"
          else
            echo "version=$base-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch vendor artifacts
        if: inputs.mode == 'full'
        run: sh vendor/fetch-vendor.sh "${{ inputs.platform }}"

      # --- Platform kernel -------------------------------------------------
      # armhf boards build their own kernel (Debian's armmp will not boot
      # them; platforms/<id>/kernel/README.md). Cached on the kernel
      # sources' hash, so a dts or config edit rebuilds and anything else
      # reuses the deb. The build is ~40-60 min on a hosted runner.
      - name: Restore platform kernel deb
        if: inputs.mode == 'full' && steps.arch.outputs.cpu_arch == 'armhf'
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: vendor/kernel
          key: kernel-deb-${{ inputs.platform }}-${{ hashFiles(format('platforms/{0}/kernel/**', inputs.platform)) }}

      - name: Build platform kernel
        if: inputs.mode == 'full' && steps.arch.outputs.cpu_arch == 'armhf' && steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev kmod debhelper rsync cpio
          bash "platforms/${{ inputs.platform }}/kernel/build-kernel.sh"

      # --- Datapath shim ---------------------------------------------------
      # openbcm platforms have no vendor SAI: the datapath is Hemlock's
      # shim linked against the SDK's userland libraries, both built
      # here. The SDK build is the long pole (an hour-plus), so the
      # finished .so is cached on everything that could change it; a
      # cache hit skips the SDK entirely. The BDE/KNET *kernel* modules
      # are not built here — mkimage builds those in the image chroot.
      - name: Restore datapath shim
        if: inputs.mode == 'full' && steps.arch.outputs.backend == 'openbcm'
        id: shim-cache
        uses: actions/cache@v4
        with:
          path: vendor/openbcm/out
          key: openbcm-shim-${{ hashFiles('src/hemlock-sai/openbcm-shim/hemlockbcm.h', 'vendor/openbcm-shim/hemlockbcm.c', 'vendor/openbcm-shim/build-sdk.sh', 'vendor/openbcm-shim/build-shim.sh', 'vendor/fetch-vendor.sh') }}

      - name: Build OpenBCM SDK + shim
        if: inputs.mode == 'full' && steps.arch.outputs.backend == 'openbcm' && steps.shim-cache.outputs.cache-hit != 'true'
        run: |
          bash vendor/openbcm-shim/build-sdk.sh
          bash vendor/openbcm-shim/build-shim.sh

      # Built before mkimage (which runs under sudo) so npm runs as the
      # normal user; mkimage skips its own web build when web/out exists.
      - name: Build web console UI
        if: inputs.mode == 'full'
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Build image (full)
        if: inputs.mode == 'full'
        # debootstrap/chroot need root; keep the user's rustup toolchain.
        run: |
          sudo --preserve-env=HOME env "PATH=$PATH" \
            CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            bash build/mkimage.sh "${{ inputs.platform }}" --version "${{ steps.ver.outputs.version }}"

      - name: Build image (dummy)
        if: inputs.mode == 'dummy'
        run: bash build/mkimage.sh "${{ inputs.platform }}" --dummy-rootfs --version "${{ steps.ver.outputs.version }}"

      - name: Verify image structure
        run: bash build/verify-image.sh build/out/hemlock-*-"${{ inputs.platform }}".bin

      - name: Boot test (QEMU)
        # x86 only: the harness boots the image's kernel under
        # qemu-system-x86. The armhf image's first boot is the bench
        # (docs/as4610-bringup.md); nothing here can stand in for it.
        if: inputs.mode == 'full' && steps.arch.outputs.cpu_arch != 'armhf'
        # Boots the image's kernel+initrd+squashfs and requires a login
        # prompt — catches initramfs hand-off regressions before hardware.
        run: |
          sudo apt-get install -y qemu-system-x86
          bash build/boot-test.sh build/out/hemlock-*-"${{ inputs.platform }}".bin --timeout 600

      - uses: actions/upload-artifact@v4
        with:
          name: hemlock-${{ steps.ver.outputs.version }}-${{ inputs.platform }}-${{ inputs.mode }}
          path: build/out/*.bin
          if-no-files-found: error
