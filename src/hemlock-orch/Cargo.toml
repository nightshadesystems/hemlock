[package]
name = "hemlock-orch"
description = "Orchestration daemon: protocol engines + the kernel RIB -> SAI pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
hemlock-common = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
clap = { workspace = true }
# iproute2 JSON parsing (the RIB kernel feed) and vtysh JSON (FRR shows).
serde_json = { workspace = true }

# LACPDU transport over the member ports' hostif netdevs.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["socket", "net"] }

[lints]
workspace = true
