[package]
name = "hemlock-common"
description = "Shared error types, logging, and IPC scaffolding for Hemlock daemons"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }

# Login-user password hashing (`system { login { user ... } }`): the
# config stores SHA-512-crypt strings, and both front-ends verify the
# yescrypt hashes Debian trixie writes into /etc/shadow. Both pure Rust.
sha-crypt = { version = "0.6", features = ["getrandom"] }
yescrypt = "0.1"

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[lints]
workspace = true
