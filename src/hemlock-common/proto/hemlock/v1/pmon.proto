// hemlock-pmon: platform environment monitoring (fans, thermal, PSU, SFP).
syntax = "proto3";
package hemlock.v1;

service Pmon {
  rpc GetEnvironment(GetEnvironmentRequest) returns (Environment);
  rpc ListTransceivers(ListTransceiversRequest) returns (ListTransceiversResponse);
}

message GetEnvironmentRequest {}

message Environment {
  repeated TemperatureSensor temperatures = 1;
  repeated Fan fans = 2;
  repeated Psu psus = 3;
}

message TemperatureSensor {
  string name = 1;
  double celsius = 2;
  double warn_celsius = 3;
  double crit_celsius = 4;
}

message Fan {
  string name = 1;
  uint32 rpm = 2;
  uint32 pwm_percent = 3;
  bool ok = 4;
  // Fan tray present (always true on platforms without presence detect).
  bool present = 5;
}

message Psu {
  string name = 1;
  bool present = 2;
  bool ok = 3;
}

message ListTransceiversRequest {}

message ListTransceiversResponse {
  repeated Transceiver transceivers = 1;
}

message Transceiver {
  string port = 1;          // front-panel port name, e.g. "Ethernet49"
  bool present = 2;
  string form_factor = 3;   // "SFP", "SFP+", ...
  string vendor = 4;
  string part_number = 5;
  string serial = 6;
  string date_code = 7;     // SFF-8472 vendor date code, e.g. "210412"
  // Compliance-derived media type, e.g. "10GBASE-SR".
  string media_type = 8;
  // Digital diagnostics (SFF-8472 A2 page); absent when the module does
  // not implement DOM.
  DomValues dom = 9;
  DomThresholds thresholds = 10;
  // Raw EEPROM pages for `show interfaces transceiver eeprom`.
  bytes eeprom_a0 = 11;
  bytes eeprom_a2 = 12;
  // Age of the cached EEPROM read ("Last Update").
  uint64 age_secs = 13;
}

message DomValues {
  double temp_c = 1;
  double voltage_v = 2;
  double bias_ma = 3;
  double tx_dbm = 4;
  double rx_dbm = 5;
}

message DomThreshold {
  double high_alarm = 1;
  double high_warn = 2;
  double low_alarm = 3;
  double low_warn = 4;
}

message DomThresholds {
  DomThreshold temperature = 1;
  DomThreshold voltage = 2;
  DomThreshold bias = 3;
  DomThreshold tx_power = 4;
  DomThreshold rx_power = 5;
}
