// --- ACLs (security suite) -------------------------------------------

enum AclFamily {
  ACL_FAMILY_UNSPECIFIED = 0;
  ACL_FAMILY_IPV4 = 1;
  ACL_FAMILY_IPV6 = 2;
  ACL_FAMILY_MAC = 3;
}

enum AclStage {
  ACL_STAGE_UNSPECIFIED = 0;
  ACL_STAGE_INGRESS = 1;
  ACL_STAGE_EGRESS = 2;
}

// One user rule. Field applicability follows the family; unset match
// fields are don't-care.
message AclRule {
  uint32 number = 1;
  bool permit = 2;
  // IP protocol number.
  optional uint32 protocol = 3;
  // Canonical CIDR prefixes; "" = any.
  string source = 4;
  string destination = 5;
  // Inclusive L4 port ranges (low == high for one port).
  optional uint32 source_port_low = 6;
  optional uint32 source_port_high = 7;
  optional uint32 destination_port_low = 8;
  optional uint32 destination_port_high = 9;
  optional uint32 dscp = 10;
  // Trap a copy to the CPU and syslog it (rate-limited by the CoPP
  // acl-log class).
  bool log = 11;
  // Per-rule policer; pps selects packet metering (burst in packets).
  optional uint64 police_rate = 12;
  optional uint64 police_burst = 13;
  bool police_pps = 14;
  // MAC-family matches: colon-lowercase address + and-mask ("" mask =
  // exact match).
  string source_mac = 15;
  string source_mac_mask = 16;
  string destination_mac = 17;
  string destination_mac_mask = 18;
  optional uint32 ethertype = 19;
}

message EnsureAclRequest {
  string name = 1;
  AclFamily family = 2;
  repeated AclRule rules = 3;
}

message EnsureAclResponse {}

message RemoveAclRequest {
  string name = 1;
}

message RemoveAclResponse {}

message BindPortAclRequest {
  // A port or Port-Channel display name.
  string port = 1;
  AclStage stage = 2;
  string acl = 3;
}

message BindPortAclResponse {}

message UnbindPortAclRequest {
  string port = 1;
  AclStage stage = 2;
}

message UnbindPortAclResponse {}

message GetAclStateRequest {}

message AclBindingState {
  string port = 1;
  AclStage stage = 2;
}

message AclStateEntry {
  string name = 1;
  AclFamily family = 2;
  repeated AclRule rules = 3;
  // Match counters parallel to `rules` (summed across bindings).
  repeated uint64 matches = 4;
  uint64 implicit_deny_matches = 5;
  repeated AclBindingState bindings = 6;
}

message TcamStageState {
  AclStage stage = 1;
  // Entries this suite programmed at the stage (IPv6 double-wide).
  uint32 used = 2;
  // Free entries as the SAI reports them.
  uint32 available = 3;
}

message GetAclStateResponse {
  repeated AclStateEntry acls = 1;
  repeated TcamStageState tcam = 2;
}

message ClearAclCountersRequest {
  // Scope to one ACL; "" = every ACL.
  string name = 1;
}

message ClearAclCountersResponse {
  uint32 cleared = 1;
}

