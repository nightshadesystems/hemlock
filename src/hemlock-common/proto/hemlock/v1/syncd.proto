// --- QoS -------------------------------------------------------------

// One `key -> value` mapping in a global QoS map (DSCP/CoS/TC values).
message QosMapEntry {
  uint32 key = 1;
  uint32 value = 2;
}

message SetQosMapsRequest {
  repeated QosMapEntry dscp_to_tc = 1;
  repeated QosMapEntry cos_to_tc = 2;
  repeated QosMapEntry tc_to_dscp = 3;
  repeated QosMapEntry tc_to_cos = 4;
}

message SetQosMapsResponse {}

// One egress queue's program. Absent from a request = platform default
// (DWRR weight 1, no shaper, no WRED).
message QueueQos {
  uint32 queue = 1;
  // Strict priority; mutually exclusive with `weight` upstream.
  bool strict = 2;
  // DWRR weight 1..127; 0 = the default (1).
  uint32 weight = 3;
  optional uint64 shape_bps = 4;
  // WRED profile name; "" = none.
  string wred_profile = 5;
}

message SetPortQosRequest {
  // A port or Port-Channel display name.
  string port = 1;
  // "untrusted" | "dscp" | "cos".
  string trust = 2;
  uint32 default_tc = 3;
  // Port shaper in bits/sec; absent = none.
  optional uint64 shape_bps = 4;
  repeated QueueQos queues = 5;
}

message SetPortQosResponse {}

message ClearPortQosRequest {
  string port = 1;
}

message ClearPortQosResponse {}

message WredProfile {
  string name = 1;
  // Thresholds in KB (1..4096, capped at the platform buffer).
  uint32 min_threshold_kb = 2;
  uint32 max_threshold_kb = 3;
  // Drop probability in percent at max_threshold.
  uint32 drop_probability = 4;
  // Mark instead of drop for ECT traffic.
  bool ecn = 5;
}

message EnsureWredProfileRequest {
  WredProfile profile = 1;
}

message EnsureWredProfileResponse {}

message RemoveWredProfileRequest {
  string name = 1;
}

message RemoveWredProfileResponse {}

message GetQosStateRequest {}

// One queue's effective program plus its live counters (baselined by
// `clear counters` like every other interface counter).
message QueueQosState {
  uint32 queue = 1;
  bool strict = 2;
  uint32 weight = 3;
  optional uint64 shape_bps = 4;
  string wred_profile = 5;
  // The bound profile's ECN flag, so a renderer needs no second lookup.
  bool ecn = 6;
  uint64 tx_packets = 7;
  uint64 tx_bytes = 8;
  uint64 dropped = 9;
  uint64 wred_dropped = 10;
  uint64 ecn_marked = 11;
}

// One port's effective QoS. Port-Channel rows summarize the config;
// member rows carry the same effective values.
message PortQosState {
  string port = 1;
  // "untrusted" | "dscp" | "cos".
  string trust = 2;
  uint32 default_tc = 3;
  optional uint64 shape_bps = 4;
  repeated QueueQosState queues = 5;
  // False for a port running entirely at the defaults.
  bool configured = 6;
  // Set on a physical port whose program comes from its Port-Channel.
  string via_port_channel = 7;
}

message GetQosStateResponse {
  repeated QosMapEntry dscp_to_tc = 1;
  repeated QosMapEntry cos_to_tc = 2;
  repeated QosMapEntry tc_to_dscp = 3;
  repeated QosMapEntry tc_to_cos = 4;
  repeated WredProfile wred_profiles = 5;
  repeated PortQosState ports = 6;
  // Ports running entirely at the defaults (the trailing `... N ports
  // with default QoS configuration` line).
  uint32 default_ports = 7;
  // The platform buffer in KB, for the WRED threshold cap; 0 = unknown.
  uint32 buffer_kb = 8;
  // Capability posture, so the web editors can gate their controls the
  // way commit does.
  bool wred_supported = 9;
  bool ecn_supported = 10;
  bool queue_shaper_supported = 11;
  // Queues per front-panel port, from the platform definition.
  uint32 queue_count = 12;
}
