// hemlock-mgmtd: the commit engine. Owns candidate/running config,
// the rollback ring, and commit-confirm.
syntax = "proto3";
package hemlock.v1;

service Mgmt {
  rpc GetConfig(GetConfigRequest) returns (ConfigText);
  rpc SetCandidate(ConfigText) returns (SetCandidateResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc ConfirmCommit(ConfirmCommitRequest) returns (ConfirmCommitResponse);
  // Load rollback N into the candidate; follow with Commit to activate.
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc ListRollbacks(ListRollbacksRequest) returns (ListRollbacksResponse);
  rpc Discard(DiscardRequest) returns (DiscardResponse);
  // Install a Hemlock OS image (.bin) over the running system in place
  // (single slot, no A/B) — mgmtd runs as root, so the CLI and web
  // console both route installs through here. Can take minutes.
  rpc InstallImage(InstallImageRequest) returns (InstallImageResponse);

  // --- Sessions and roles -----------------------------------------------
  // Who the caller is and what they are allowed to do. Both front-ends
  // ask once at session start and cache the answer; the role comes from
  // `system { login { user <name> { role ... } } }`.
  //
  // The caller names itself: the daemon sockets are already gated on
  // the `hemlock` group, and an operator with shell access can run
  // anything their OS account permits, so roles are a guard rail for
  // the two consoles rather than a privilege boundary (see
  // hemlock_common::role).
  //
  // A non-empty `client` also registers the session, so `show system
  // users` can list who is on the box.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Slide a registered session's idle timer.
  rpc TouchSession(TouchSessionRequest) returns (TouchSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // The tail of the system journal, for `show logging` and the web
  // console's live tail. mgmtd runs as root, so it can read the whole
  // journal where an operator account may not.
  rpc GetLog(GetLogRequest) returns (GetLogResponse);
}

enum ConfigSource {
  CONFIG_SOURCE_UNSPECIFIED = 0;
  CONFIG_SOURCE_RUNNING = 1;
  CONFIG_SOURCE_CANDIDATE = 2;
}

message GetConfigRequest {
  ConfigSource source = 1;
}

message ConfigText {
  string text = 1;
}

message SetCandidateResponse {
  bool valid = 1;
  repeated string errors = 2;
}

message CommitRequest {
  string comment = 1;
  // Non-zero enables commit-confirm: auto-rollback unless ConfirmCommit
  // arrives within this many seconds.
  uint32 confirm_timeout_secs = 2;
  // Who is committing, and from which console ("cli" | "web").
  // Recorded in the rollback ring and surfaced by `show system commits`.
  string user = 3;
  string client = 4;
}

message CommitResponse {
  uint64 commit_id = 1;
  repeated string applied_changes = 2;
  // Non-fatal notices for the operator — today, that this commit
  // changed or removed their own account.
  repeated string warnings = 3;
}

message ConfirmCommitRequest {}
message ConfirmCommitResponse {
  bool was_pending = 1;
}

message RollbackRequest {
  uint32 revisions_back = 1;  // 1 = previous running config
}

message RollbackResponse {
  string loaded_text = 1;
}

message ListRollbacksRequest {}

message ListRollbacksResponse {
  repeated RollbackEntry entries = 1;
}

message RollbackEntry {
  uint32 revisions_back = 1;
  string committed_at = 2;   // RFC 3339
  string comment = 3;
}

message DiscardRequest {}
message DiscardResponse {}

message InstallImageRequest {
  string path = 1;   // absolute path of the .bin on the switch
  bool force = 2;    // install despite a platform mismatch
  bool reboot = 3;   // reboot into the new image after installing
}

message InstallImageResponse {
  string version = 1;   // from the image header
  string platform = 2;
}

message WhoAmIRequest {
  string user = 1;
  // "cli" | "web"; empty asks for the role without registering a session.
  string client = 2;
  // Peer address, or "console" for a local login.
  string from = 3;
}

message WhoAmIResponse {
  string user = 1;
  string role = 2;          // "admin" | "operator"
  uint64 session_id = 3;    // 0 when nothing was registered
  // `system { web { session-timeout } }`, in minutes — the console
  // reads its own idle timeout from here.
  uint32 web_session_timeout_mins = 4;
  // False when the config manages no login users at all, so the role
  // came from the OS account instead (sudo membership).
  bool config_managed = 5;
}

message TouchSessionRequest {
  uint64 session_id = 1;
}

message TouchSessionResponse {
  bool known = 1;
}

message CloseSessionRequest {
  uint64 session_id = 1;
}

message CloseSessionResponse {}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionEntry sessions = 1;
}

message GetLogRequest {
  // Lines to return, newest last; 0 means the default (50).
  uint32 count = 1;
}

message GetLogResponse {
  repeated LogEntry entries = 1;
  // False when the journal could not be read at all (no journalctl, or
  // a development host) — the caller says so rather than showing an
  // empty log as if the box were silent.
  bool available = 2;
}

message LogEntry {
  int64 time_unix = 1;
  string host = 2;
  // The syslog identifier, e.g. "mgmtd".
  string tag = 3;
  uint32 pid = 4;   // 0 = none recorded
  string message = 5;
  // Syslog severity 0..7; 8 = the journal did not say.
  uint32 severity = 6;
}

message SessionEntry {
  string user = 1;
  string from = 2;
  string client = 3;   // "cli" | "web"
  string role = 4;
  uint64 idle_secs = 5;
  string login_time = 6;   // RFC 3339
}
