// hemlock-orch: the control-plane protocol engines (LACP now; STP and
// IGMP/MLD snooping to follow). mgmtd pushes desired state after every
// commit (and at boot replay); the engines drive syncd and serve their
// runtime state to `show`.
syntax = "proto3";
package hemlock.v1;

service Orch {
  rpc GetStatus(GetOrchStatusRequest) returns (OrchStatus);

  // Full desired LAG/LACP state (declarative: replaces the previous
  // push; an empty list tears every LAG's protocol state down).
  rpc SetLagConfigs(SetLagConfigsRequest) returns (SetLagConfigsResponse);

  // LACP runtime state for `show lacp ...` / `show port-channel ...`.
  rpc GetLacpState(GetLacpStateRequest) returns (GetLacpStateResponse);

  // Full desired spanning-tree state (declarative).
  rpc SetStpConfig(SetStpConfigRequest) returns (SetStpConfigResponse);

  // Spanning-tree runtime state for `show spanning-tree ...`.
  rpc GetStpState(GetStpStateRequest) returns (GetStpStateResponse);

  // Full desired snooping state for one family (declarative).
  rpc SetSnoopingConfig(SetSnoopingConfigRequest) returns (SetSnoopingConfigResponse);

  // Snooping runtime state for `show igmp|mld snooping ...`.
  rpc GetSnoopingState(GetSnoopingStateRequest) returns (GetSnoopingStateResponse);

  // --- The RIB (kernel -> orch -> syncd pipeline) ----------------------
  // The RIB snapshot for `show ip route` / `show ipv6 route`: statics,
  // connected, and FRR routes uniformly, with FIB (hardware) state.
  rpc GetRib(GetRibRequest) returns (GetRibResponse);
  // The kernel neighbor table for `show arp` / `show ipv6 neighbors`.
  rpc GetNeighbors(GetNeighborsRequest) returns (GetNeighborsResponse);
  // `clear arp [<ip>]`: flush dynamic kernel neighbor entries (statics
  // survive); the change flows back through the RIB pipeline.
  rpc ClearNeighbors(ClearNeighborsRequest) returns (ClearNeighborsResponse);

  // --- FRR protocol detail (queried live from vtysh) -------------------
  // orch owns vtysh access: hemlockctl and webd ask orch. A dead FRR
  // degrades to a failed-precondition ("ospf is not running").
  rpc GetOspfState(GetOspfStateRequest) returns (GetOspfStateResponse);
  rpc GetBgpState(GetBgpStateRequest) returns (GetBgpStateResponse);
  rpc GetVrrpState(GetVrrpStateRequest) returns (GetVrrpStateResponse);
  // `clear routing bgp <neighbor|*>`.
  rpc ClearBgp(ClearBgpRequest) returns (ClearBgpResponse);

  // --- 802.1X (hostapd-backed authenticator) ---------------------------
  // Full desired dot1x state (declarative). orch owns hostapd end to
  // end: it renders the config, manages the process, watches the
  // control socket, and flips port authorization via syncd.
  rpc SetDot1xConfig(SetDot1xConfigRequest) returns (SetDot1xConfigResponse);
  // Runtime auth state for `show dot1x ...`.
  rpc GetDot1xState(GetDot1xStateRequest) returns (GetDot1xStateResponse);
  // `clear dot1x interface <port>`: force reauthentication.
  rpc Dot1xReauth(Dot1xReauthRequest) returns (Dot1xReauthResponse);

  // --- LLDP (native engine over the ports' hostif netdevs) -------------
  // Full desired LLDP state (declarative). orch runs the tx timers,
  // ages the neighbor table, and serves both to `show lldp ...`.
  rpc SetLldpConfig(SetLldpConfigRequest) returns (SetLldpConfigResponse);
  // Per-port counters + the neighbor table for `show lldp [neighbors]`.
  rpc GetLldpState(GetLldpStateRequest) returns (GetLldpStateResponse);
  // `clear lldp counters`: baseline the per-port frame counters.
  rpc ClearLldpCounters(ClearLldpCountersRequest) returns (ClearLldpCountersResponse);

  // --- NTP client (systemd-timesyncd) ----------------------------------
  // Live sync state for `show ntp`. mgmtd renders the timesyncd
  // drop-in; orch owns the `timedatectl` query surface, the way it
  // owns vtysh for FRR.
  rpc GetNtpState(GetNtpStateRequest) returns (GetNtpStateResponse);

  // --- DHCP snooping + dynamic ARP inspection --------------------------
  // Full desired snooping/DAI state (declarative). The engine drives
  // the CPU redirects into syncd, validates trapped packets, maintains
  // the binding table, and re-injects valid frames.
  rpc SetSnoopSecConfig(SetSnoopSecConfigRequest) returns (SetSnoopSecConfigResponse);
  // Bindings + statistics for `show dhcp snooping` / `show arp
  // inspection`.
  rpc GetSnoopSecState(GetSnoopSecStateRequest) returns (GetSnoopSecStateResponse);
  // `clear dhcp snooping binding [<mac>]` (dynamics only).
  rpc ClearSnoopBinding(ClearSnoopBindingRequest) returns (ClearSnoopBindingResponse);
}

message GetOrchStatusRequest {}

message OrchStatus {
  bool running = 1;
  string detail = 2;
}

enum LacpConfigMode {
  LACP_CONFIG_MODE_UNSPECIFIED = 0;
  LACP_CONFIG_MODE_ACTIVE = 1;
  LACP_CONFIG_MODE_PASSIVE = 2;
  // Static aggregation, no LACP.
  LACP_CONFIG_MODE_ON = 3;
}

enum LagFallbackMode {
  LAG_FALLBACK_MODE_UNSPECIFIED = 0;
  LAG_FALLBACK_MODE_NONE = 1;
  LAG_FALLBACK_MODE_STATIC = 2;
  LAG_FALLBACK_MODE_INDIVIDUAL = 3;
}

message LacpMemberConfig {
  string port = 1;
  LacpConfigMode mode = 2;
  // Fast = 1s LACPDUs; default (false) = 30s.
  bool rate_fast = 3;
  // 0 = default (32768).
  uint32 port_priority = 4;
}

message LagConfig {
  uint32 group = 1;              // 1..64
  uint32 min_links = 2;          // 0 = no minimum
  LagFallbackMode fallback = 3;
  uint32 fallback_timeout_secs = 4;  // 0 = default (90)
  repeated LacpMemberConfig members = 5;
}

message SetLagConfigsRequest {
  repeated LagConfig lags = 1;
  // 0 = default (32768).
  uint32 system_priority = 2;
}

message SetLagConfigsResponse {}

message GetLacpStateRequest {}

message MemberLacpState {
  string port = 1;
  // "bundled" | "standby" | "down" | "individual"
  string status = 2;
  bool rate_fast = 3;
  // IEEE 802.1AX actor/partner state octets.
  uint32 actor_state = 4;
  uint32 partner_state = 5;
  // Partner identity; empty system = no partner heard (defaulted).
  string partner_system = 6;   // "32768,d4:af:f7:12:9c:00"
  uint32 partner_port = 7;
  uint32 partner_key = 8;
  uint32 partner_priority = 9;
  uint64 pdus_rx = 10;
  uint64 pdus_tx = 11;
  // Times the member's mux state churned.
  uint32 churn = 12;
}

message LagLacpState {
  uint32 group = 1;
  // False = static (`mode on`).
  bool lacp = 2;
  bool active_mode = 3;
  uint32 bundled = 4;
  uint32 total = 5;
  bool up = 6;
  uint32 min_links = 7;
  // "" (off) | "static" | "individual"
  string fallback_mode = 8;
  uint32 fallback_timeout_secs = 9;
  bool fallback_active = 10;
  repeated MemberLacpState members = 11;
}

message GetLacpStateResponse {
  // "32768,2c:dd:e9:4a:1b:00"
  string system_id = 1;
  repeated LagLacpState lags = 2;
}

// --- Spanning tree ---------------------------------------------------

message StpPortConfig {
  string port = 1;
  bool portfast = 2;
  bool bpduguard = 3;
  uint32 cost = 4;      // 0 = derive from link speed
  uint32 priority = 5;  // 0 = default (128)
}

message MstInstanceMap {
  uint32 instance = 1;
  repeated uint32 vlans = 2;
}

message SetStpConfigRequest {
  string mode = 1;  // "mstp" | "rstp" | "none"
  uint32 priority = 2;      // 0 = default (32768)
  uint32 hello_time = 3;    // 0 = default (2)
  uint32 max_age = 4;       // 0 = default (20)
  uint32 forward_time = 5;  // 0 = default (15)
  string mst_name = 6;
  uint32 mst_revision = 7;
  repeated MstInstanceMap instances = 8;
  repeated StpPortConfig ports = 9;
}

message SetStpConfigResponse {}

message GetStpStateRequest {}

message StpPortStateInfo {
  string port = 1;
  string role = 2;   // designated | root | alternate | disabled
  string state = 3;  // discarding | learning | forwarding
  uint32 cost = 4;
  uint32 priority = 5;
  bool portfast = 6;
  bool bpduguard = 7;
  uint64 bpdus_rx = 8;
  uint64 bpdus_tx = 9;
  bool errdisabled = 10;
}

// --- IGMP/MLD snooping -----------------------------------------------

message SnoopingVlanConfig {
  uint32 vlan = 1;
  bool disabled = 2;
  bool fast_leave = 3;
  bool querier = 4;
  string querier_address = 5;  // "" = derive (unspecified address)
  repeated string mrouters = 6;
}

message SetSnoopingConfigRequest {
  string family = 1;  // "igmp" | "mld"
  bool disabled = 2;
  uint32 robustness = 3;  // 0 = default (2)
  repeated SnoopingVlanConfig vlans = 4;
}

message SetSnoopingConfigResponse {}

message GetSnoopingStateRequest {
  string family = 1;
}

message SnoopingGroupState {
  string group = 1;
  uint32 version = 2;
  repeated string ports = 3;
}

message SnoopingVlanState {
  uint32 vlan = 1;
  bool enabled = 2;
  bool fast_leave = 3;
  bool querier_enabled = 4;
  string querier_address = 5;
  bool querier_active = 6;
  repeated string static_mrouters = 7;
  repeated string dynamic_mrouters = 8;
  repeated SnoopingGroupState groups = 9;
}

message GetSnoopingStateResponse {
  bool enabled = 1;
  uint32 robustness = 2;
  repeated SnoopingVlanState vlans = 3;
}

message GetStpStateResponse {
  string mode = 1;
  uint32 bridge_priority = 2;
  string bridge_mac = 3;  // colon-separated lowercase
  uint32 root_priority = 4;
  string root_mac = 5;
  bool is_root = 6;
  uint32 root_cost = 7;
  string root_port = 8;
  uint32 hello_time = 9;
  uint32 max_age = 10;
  uint32 forward_time = 11;
  string mst_name = 12;
  uint32 mst_revision = 13;
  repeated MstInstanceMap instances = 14;
  uint32 topology_changes = 15;
  optional uint64 seconds_since_tc = 16;
  string last_tc_port = 17;
  repeated StpPortStateInfo ports = 18;
}

// --- RIB ----------------------------------------------------------------

message GetRibRequest {
  bool ipv6 = 1;
  // Paging: 0 = everything.
  uint32 page_size = 2;
  // The prefix to continue after (from next_page_token).
  string page_token = 3;
}

message GetRibResponse {
  repeated RibRoute routes = 1;
  // Non-empty when a page_size was given and more routes remain.
  string next_page_token = 2;
}

message RibRoute {
  // Canonical CIDR prefix.
  string prefix = 1;
  // "connected" | "static" | "kernel" | "ospf" | "bgp".
  string protocol = 2;
  uint32 distance = 3;
  uint32 metric = 4;
  // Seconds since orch first saw the route.
  uint64 uptime_secs = 5;
  repeated RibNextHop next_hops = 6;
  // FIB state: "programmed" | "punt" | "drop" | "connected" | "kernel".
  string fib = 7;
  // Directly-connected egress interface (connected routes).
  string interface = 8;
}

message RibNextHop {
  string via = 1;
  string interface = 2;
  // The next hop has a resolved neighbor entry (hardware-forwardable).
  bool resolved = 3;
}

message GetNeighborsRequest {
  bool ipv6 = 1;
}

message GetNeighborsResponse {
  repeated NeighborEntry neighbors = 1;
}

message NeighborEntry {
  string ip = 1;
  // Colon-separated lowercase; empty while unresolved.
  string mac = 2;
  string interface = 3;
  // A configured static (permanent) entry.
  bool permanent = 4;
  // Seconds since the entry was last confirmed; unset when unknown.
  optional uint64 age_secs = 5;
}

message ClearNeighborsRequest {
  // Scope the flush to one address; empty = every dynamic entry.
  string ip = 1;
}

message ClearNeighborsResponse {
  bool flushed = 1;
}

// --- FRR protocol detail ------------------------------------------------

message GetOspfStateRequest {}

message OspfArea {
  string id = 1;
  uint32 interfaces = 2;
}

message OspfNeighborState {
  string router_id = 1;
  uint32 priority = 2;
  // "Full", "2-Way", ... (the DR suffix stripped).
  string state = 3;
  uint64 dead_time_msecs = 4;
  string address = 5;
  string interface = 6;
}

message OspfInterfaceState {
  string name = 1;
  bool up = 2;
  // CIDR form.
  string address = 3;
  string area = 4;
  string router_id = 5;
  // "BROADCAST", "POINTOPOINT", ...
  string network_type = 6;
  uint32 cost = 7;
  string state = 8;
  uint32 priority = 9;
  string dr_id = 10;
  string dr_address = 11;
  uint32 hello_interval = 12;
  uint32 dead_interval = 13;
  uint32 neighbors = 14;
  uint32 adjacent = 15;
}

message GetOspfStateResponse {
  string router_id = 1;
  uint32 spf_runs = 2;
  repeated OspfArea areas = 3;
  repeated OspfNeighborState neighbors = 4;
  repeated OspfInterfaceState interfaces = 5;
}

message GetBgpStateRequest {
  // Detail for one neighbor; empty = summary + RIB.
  string neighbor = 1;
}

message BgpPeerState {
  string ip = 1;
  uint32 version = 2;
  uint32 remote_as = 3;
  uint64 msg_rcvd = 4;
  uint64 msg_sent = 5;
  uint32 in_q = 6;
  uint32 out_q = 7;
  // FRR's formatted uptime ("2d04h", "never").
  string up_down = 8;
  // "Established", "Idle", ...
  string state = 9;
  int64 pfx_rcvd = 10;
}

message BgpRibEntry {
  string network = 1;
  string next_hop = 2;
  // Textual; "-" when absent.
  string metric = 3;
  string loc_pref = 4;
  // AS-path plus origin code ("65001 i").
  string path = 5;
  bool valid = 6;
  bool best = 7;
}

message BgpNeighborDetail {
  string ip = 1;
  uint32 remote_as = 2;
  string description = 3;
  string state = 4;
  string uptime = 5;
  uint64 msg_rcvd = 6;
  uint64 msg_sent = 7;
  int64 prefixes_received = 8;
  int64 prefixes_accepted = 9;
  int64 prefixes_advertised = 10;
  bool next_hop_self = 11;
  uint32 ebgp_multihop = 12;
}

message GetBgpStateResponse {
  string router_id = 1;
  uint32 as_number = 2;
  repeated BgpPeerState peers = 3;
  repeated BgpRibEntry routes = 4;
  BgpNeighborDetail detail = 5;
}

message GetVrrpStateRequest {}

message VrrpGroupState {
  string interface = 1;
  uint32 group = 2;
  uint32 priority = 3;
  uint32 effective_priority = 4;
  uint32 advertisement_interval_ms = 5;
  bool preempt = 6;
  // "Master" | "Backup" | "Initialize".
  string state = 7;
  repeated string addresses = 8;
  string virtual_mac = 9;
  uint32 skew_time_ms = 10;
  uint32 master_down_interval_ms = 11;
  // Seconds since the last state transition; unset = unknown.
  optional uint64 seconds_since_transition = 12;
}

message GetVrrpStateResponse {
  repeated VrrpGroupState groups = 1;
}

message ClearBgpRequest {
  // A neighbor address, or "*" for every peer.
  string neighbor = 1;
}

message ClearBgpResponse {
  bool cleared = 1;
}

// --- 802.1X -------------------------------------------------------------

message RadiusServerConfig {
  string ip = 1;
  // Shared secret; rendered into hostapd's config (mode 0600), never
  // echoed back in state.
  string key = 2;
  uint32 port = 3;
  uint32 timeout_secs = 4;
  uint32 retransmit = 5;
}

message SetDot1xConfigRequest {
  // Tried in order.
  repeated RadiusServerConfig radius_servers = 1;
  // Seconds; 0 = reauthentication off.
  uint32 reauth_interval = 2;
  // Ports running the authenticator.
  repeated string ports = 3;
}

message SetDot1xConfigResponse {}

message GetDot1xStateRequest {
  // Scope to one port; "" = every dot1x port.
  string port = 1;
}

message Dot1xPortState {
  string port = 1;
  // "authorized" | "unauthorized".
  string status = 2;
  // Colon-lowercase; "" while no supplicant is heard.
  string supplicant_mac = 3;
  optional uint64 last_auth_secs_ago = 4;
  uint32 failures = 5;
}

message GetDot1xStateResponse {
  // Display forms ("10.42.0.5:1812"), in config order.
  repeated string radius_servers = 1;
  uint32 reauth_interval = 2;
  repeated Dot1xPortState ports = 3;
}

message Dot1xReauthRequest {
  string port = 1;
}

message Dot1xReauthResponse {
  bool triggered = 1;
}

// --- DHCP snooping + DAI ------------------------------------------------

message StaticBindingConfig {
  string mac = 1;
  uint32 vlan = 2;
  string address = 3;
  string interface = 4;
}

message SetSnoopSecConfigRequest {
  repeated uint32 dhcp_vlans = 1;
  repeated uint32 arp_vlans = 2;
  // "src-mac" | "dst-mac" | "ip"; empty = default (src-mac).
  repeated string validate = 3;
  // Trusted interfaces (ports or Port-Channels).
  repeated string dhcp_trusted = 4;
  repeated string arp_trusted = 5;
  repeated StaticBindingConfig static_bindings = 6;
}

message SetSnoopSecConfigResponse {}

message GetSnoopSecStateRequest {}

message SnoopBindingState {
  string mac = 1;
  string address = 2;
  // Remaining lease; unset for statics.
  optional uint64 lease_secs = 3;
  bool is_static = 4;
  uint32 vlan = 5;
  string interface = 6;
}

message SnoopVlanStats {
  uint32 vlan = 1;
  uint64 packets = 2;
  uint64 dropped = 3;
}

message DaiVlanStats {
  uint32 vlan = 1;
  uint64 forwarded = 2;
  uint64 dropped = 3;
  uint64 bad_binding = 4;
  uint64 bad_src_mac = 5;
}

message GetSnoopSecStateResponse {
  repeated uint32 dhcp_vlans = 1;
  repeated string dhcp_trusted = 2;
  repeated SnoopBindingState bindings = 3;
  repeated SnoopVlanStats dhcp_stats = 4;
  uint64 untrusted_server_drops = 5;
  repeated uint32 arp_vlans = 6;
  repeated string validate = 7;
  repeated string arp_trusted = 8;
  repeated DaiVlanStats arp_stats = 9;
}

message ClearSnoopBindingRequest {
  // Scope to one MAC; "" = every dynamic binding.
  string mac = 1;
}

message ClearSnoopBindingResponse {
  uint32 cleared = 1;
}

// --- LLDP ---------------------------------------------------------------

message SetLldpConfigRequest {
  // LLDP runs by default; this is the global off switch.
  bool disabled = 1;
  uint32 tx_interval = 2;      // 0 = default (30)
  uint32 hold_multiplier = 3;  // 0 = default (4)
  // Ports carrying `lldp disable`.
  repeated string disabled_ports = 4;
}

message SetLldpConfigResponse {}

message GetLldpStateRequest {
  // Scope the neighbor list to one port; "" = every LLDP port.
  string port = 1;
}

message LldpNeighborState {
  // Colon-separated lowercase MAC, or whatever the chassis subtype
  // carried.
  string chassis_id = 1;
  // "mac" | "interface-name" | "local" | "network-address" | ...
  string chassis_id_subtype = 2;
  string port_id = 3;
  string port_id_subtype = 4;
  string port_description = 5;
  string system_name = 6;
  string system_description = 7;
  string management_address = 8;
  // The TTL the neighbor advertised.
  uint32 ttl = 9;
  // Seconds since the last frame from this neighbor.
  uint64 age_secs = 10;
}

message LldpPortState {
  string port = 1;
  bool enabled = 2;
  uint64 frames_tx = 3;
  uint64 frames_rx = 4;
  uint64 frames_discarded = 5;
  uint64 ageouts = 6;
  repeated LldpNeighborState neighbors = 7;
}

message GetLldpStateResponse {
  bool enabled = 1;
  uint32 tx_interval = 2;
  uint32 hold_multiplier = 3;
  // Colon-separated lowercase switch base MAC.
  string chassis_id = 4;
  string system_name = 5;
  string system_description = 6;
  string management_address = 7;
  repeated LldpPortState ports = 8;
}

message ClearLldpCountersRequest {
  // Scope to one port; "" = every port.
  string port = 1;
}

message ClearLldpCountersResponse {
  uint32 cleared = 1;
}

// --- NTP ----------------------------------------------------------------

message GetNtpStateRequest {}

message GetNtpStateResponse {
  // systemd-timesyncd is running (mgmtd stops it when no server is
  // configured).
  bool enabled = 1;
  // The servers timesyncd was given, in order.
  repeated string servers = 2;
  bool synchronized = 3;
  // The server actually in use; "" while unsynchronized.
  string server = 4;
  uint32 stratum = 5;
  uint32 poll_interval_secs = 6;
  // Microseconds. The offset is signed (the local clock can lead).
  int64 offset_usecs = 7;
  uint64 delay_usecs = 8;
  uint64 jitter_usecs = 9;
  // Seconds since the last accepted reply; unset = never, or the
  // timestamp was unreadable.
  optional uint64 last_sync_secs_ago = 10;
}
