! Managed by hemlock-mgmtd; edit via the Hemlock config, not here.
frr defaults traditional
!
interface Vlan100
 vrrp 10 priority 200
 vrrp 10 advertisement-interval 1000
 vrrp 10 ip 10.0.100.1
exit
!
router ospf
 ospf router-id 10.42.0.1
 maximum-paths 4
 network 10.42.10.0/24 area 0.0.0.0
 passive-interface Vlan100
 redistribute static
exit
!
router bgp 65000
 bgp router-id 10.42.0.1
 neighbor 10.42.10.1 remote-as 65001
 neighbor 10.42.10.1 description upstream
 address-family ipv4 unicast
  maximum-paths 4
  network 10.42.0.0/16
  redistribute connected
 exit-address-family
exit
!
