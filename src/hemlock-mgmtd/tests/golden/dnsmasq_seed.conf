# Managed by hemlock-mgmtd; edit via the Hemlock config, not here.
# DHCP only: the DNS half is off.
port=0
bind-dynamic
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
dhcp-authoritative

# pool LAN-USERS (10.0.10.0/24)
dhcp-range=set:LAN-USERS,10.0.10.100,10.0.10.200,255.255.255.0,86400
dhcp-option=tag:LAN-USERS,option:router,10.0.10.1
dhcp-option=tag:LAN-USERS,option:dns-server,10.42.0.5,10.42.0.6
dhcp-host=00:1c:73:0c:aa:01,10.0.10.50
