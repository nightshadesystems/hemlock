# Managed by hemlock-mgmtd; edit via the Hemlock config, not here.

# The journal is the local log store; rsyslog only forwards.
module(load="imjournal" StateFile="hemlock-imjournal")

# Forwarding at `informational` and above.
*.info action(type="omfwd" target="10.42.0.30" port="514" protocol="udp")
*.info action(type="omfwd"
    target="10.42.0.31" port="6514"
    protocol="tcp"
    action.resumeRetryCount="-1"
    queue.type="linkedList"
    queue.size="10000"
    queue.filename="hemlock-10-42-0-31"
    queue.saveOnShutdown="on")
