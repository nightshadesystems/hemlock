# Managed by hemlock-mgmtd; edit via the Hemlock config, not here.
agentaddress udp:10.42.0.9:161

# The IF-MIB comes from hemlock-orch's AgentX subagent (ASIC
# counters, not kernel netdev ones), so snmpd serves transport,
# auth and the system group only.
master agentx
agentXSocket /var/agentx/master
agentXPerms 0660 0550

# v2c, read-only. A community with a source only answers there.
rocommunity public
rocommunity6 public

